# ==========================================================
# 数据源配置
# 库名 my_db / 账号 root —— 与本机 MySQL 实际一致（2026-10-08 确认）
# ==========================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/my_db?serverTimezone=GMT&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=zxcv1234

# ==========================================================
# MyBatis 配置
# ==========================================================
# 指定Mybatis的Mapper文件（本工程走注解方式，无需XML；
#   如需改为XML方式，把 mapper 放在 src/main/resources/mappers/ 下即可自动生效）
mybatis.mapper-locations=classpath:mappers/*xml

# 指定Mybatis的实体目录（注意：实际包名是 pojo，不是 mybatis.entity）
mybatis.type-aliases-package=com.ape.springboot_mybatis.pojo

# 打印SQL执行日志 —— 调试MyBatis 必备，定位参数问题全靠它
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 开启驼峰命名自动映射：数据库 tb_user_account -> Java 侧 TbUserAccount
mybatis.configuration.map-underscore-to-camel-case=true